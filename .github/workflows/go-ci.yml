name: Go CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOVULNCHECK_VERSION: v1.6.0
  MIN_COVERAGE: "37.8"
  STATICCHECK_VERSION: "2026.1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true
          cache-dependency-path: go.sum

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Files need gofmt:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run staticcheck
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Run race tests with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Run webhook integration flow with race detector
        run: go test -race -tags=integration ./tests/integration

      - name: Enforce coverage floor
        run: |
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v actual="$coverage" -v minimum="$MIN_COVERAGE" 'BEGIN {
            if (actual + 0 < minimum + 0) {
              printf "coverage %.1f%% is below %.1f%%\n", actual, minimum > "/dev/stderr"
              exit 1
            }
          }'
          printf 'Total coverage: %s%%\n' "$coverage"

      - name: Build commands
        run: go build ./...

      - name: Scan reachable vulnerabilities
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...
